version: '3.8'

services:
  banco-de-dentes:
    build:
      context: ..
      dockerfile: builds/Dockerfile
    image: banco-de-dentes:desenvolvimento
    container_name: banco-de-dentes
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE: "desenvolvimento"
      MYSQL_HOST: "banco-de-dentes-db"
    depends_on:
      - banco-de-dentes-db

  banco-de-dentes-db:
    image: mysql:8.0
    container_name: banco-de-dentes-db
    environment:
      MYSQL_DATABASE: BANCO_DENTES
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: