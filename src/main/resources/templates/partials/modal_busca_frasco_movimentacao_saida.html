<div class="modal-overlay" id="modalBuscaFrascoMovimentacao">
    <div class="modal glass-frost" role="dialog" aria-modal="true" aria-labelledby="modalBuscaFrascoMovimentacaoTitle">

        <header class="modal__header">
            <h2 id="modalBuscaFrascoMovimentacaoTitle">
                <i class="icon" data-lucide="search"></i>
                Buscar Frasco
            </h2>

            <button type="button" class="modal__close" id="modalBuscaFrascoMovimentacaoClose" aria-label="Fechar">
                <i class="icon" data-lucide="x"></i>
            </button>
        </header>

        <div class="modal__body">

            <div class="modal__body-fixed">
                <div class="modal-search-row">
                    <div class="search-wrapper modal-search">
                        <input type="search" id="modalBuscaFrascoMovimentacaoInput" placeholder="Buscar por identificador...">

                        <button type="button" class="search-clear" aria-label="Limpar busca" tabindex="-1"></button>
                        <i class="search-icon" data-lucide="search"></i>
                    </div>

                    <button type="button" class="modal-filter-toggle tooltip-below" aria-expanded="false"
                            data-tooltip="Filtros do frasco" aria-label="Mostrar filtros do frasco">
                        <i class="icon" data-lucide="filter"></i>
                        <span class="modal-filter-toggle__dot" hidden></span>
                    </button>
                </div>

                <div class="modal-filters-collapse">
                    <div class="modal-filters-collapse__inner">
                        <div class="modal-filters">
                            <div class="select-wrapper">
                                <select class="form-control" id="modalFiltroGrupoMovimentacao">
                                    <option value="">Grupo dentário</option>
                                    <option value="Molar">Molar</option>
                                    <option value="Pré-Molar">Pré-Molar</option>
                                    <option value="Canino">Canino</option>
                                    <option value="Incisivo">Incisivo</option>
                                    <option value="Endo">Endo</option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>

                            <div class="select-wrapper">
                                <select class="form-control" id="modalFiltroEstadoMovimentacao">
                                    <option value="">Estado do dente</option>
                                    <option value="Hígido">Hígido</option>
                                    <option value="Cariado">Cariado</option>
                                    <option value="Restaurado">Restaurado</option>
                                    <option value="Misto">Misto</option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>

                            <div class="select-wrapper">
                                <select class="form-control" id="modalFiltroDenticaoMovimentacao">
                                    <option value="">Dentição</option>
                                    <option value="Permanente">Permanente</option>
                                    <option value="Decídua">Decídua</option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-filters">
                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroStatusMovimentacao">
                            <option value="todos" selected>Todos</option>
                            <option value="escolhidos">Já Escolhidos</option>
                            <option value="manutencao">Em Manutenção</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalOrdenarMovimentacao">
                            <option value="">Ordenar por</option>
                            <option value="disponivel-asc">Disponível (menor p/ maior)</option>
                            <option value="disponivel-desc">Disponível (maior p/ menor)</option>
                            <option value="manutencao-asc">Manutenção (mais próxima)</option>
                            <option value="manutencao-desc">Manutenção (mais antiga)</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="modal-results-scroll">
                <div class="modal-results" id="modalBuscaFrascoMovimentacaoResults">
                </div>

                <p class="modal-empty" id="modalBuscaFrascoMovimentacaoEmpty">
                    Escolha um grupo dentário ou pesquise por um identificador para ver os frascos disponíveis.
                </p>
            </div>
        </div>

        <footer class="modal__footer">
            <span class="modal__footer-hint" id="modalBuscaFrascoMovimentacaoCount">Nenhuma busca realizada</span>

            <div class="pagination__nav">
                <span class="pagination__range" id="modalPaginationRangeMovimentacao">0-0</span>

                <button type="button" class="btn btn-pagination" id="modalPaginationPrevMovimentacao" data-tooltip="Página Anterior" aria-label="Página Anterior">
                    <i class="icon" data-lucide="chevron-left"></i>
                </button>

                <button type="button" class="btn btn-pagination" id="modalPaginationNextMovimentacao" data-tooltip="Próxima Página" aria-label="Próxima Página">
                    <i class="icon" data-lucide="chevron-right"></i>
                </button>
            </div>
        </footer>
    </div>
</div>
