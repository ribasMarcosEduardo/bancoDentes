<div class="modal-overlay" id="modalBuscaFrascoMovimentacaoOutrosFrascos">
    <div class="modal glass-frost" role="dialog" aria-modal="true" aria-labelledby="modalBuscaFrascoMovimentacaoOutrosFrascosTitle">

        <header class="modal__header">
            <h2 id="modalBuscaFrascoMovimentacaoOutrosFrascosTitle">
                <i class="icon" data-lucide="search"></i>
                Selecionar Frascos de Origem
            </h2>

            <button type="button" class="modal__close" id="modalBuscaFrascoMovimentacaoOutrosFrascosClose" aria-label="Fechar">
                <i class="icon" data-lucide="x"></i>
            </button>
        </header>

        <div class="modal__body">

            <div class="modal__body-fixed">
                <div class="search-wrapper modal-search">
                    <input type="search" id="modalBuscaFrascoMovimentacaoOutrosFrascosInput" placeholder="Buscar por identificador...">

                    <button type="button" class="search-clear" aria-label="Limpar busca" tabindex="-1"></button>
                    <i class="search-icon" data-lucide="search"></i>
                </div>

                <div class="modal-filters">
                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroStatusMovimentacaoOutrosFrascos">
                            <option value="todos" selected>Todos</option>
                            <option value="escolhidos">Já Escolhidos</option>
                            <option value="manutencao">Em Manutenção</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalOrdenarMovimentacaoOutrosFrascos">
                            <option value="">Ordenar por</option>
                            <option value="disponivel-asc">Disponível (menor p/ maior)</option>
                            <option value="disponivel-desc">Disponível (maior p/ menor)</option>
                            <option value="manutencao-asc">Manutenção (mais próxima)</option>
                            <option value="manutencao-desc">Manutenção (mais antiga)</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="modal-results-scroll">
                <div class="modal-results" id="modalBuscaFrascoMovimentacaoOutrosFrascosResults">
                </div>

                <p class="modal-empty" id="modalBuscaFrascoMovimentacaoOutrosFrascosEmpty">
                    Nenhum frasco encontrado com esses critérios.
                </p>
            </div>
        </div>

        <footer class="modal__footer">
            <span class="modal__footer-hint" id="modalBuscaFrascoMovimentacaoOutrosFrascosCount">Nenhuma busca realizada</span>

            <div class="pagination__nav">
                <span class="pagination__range" id="modalPaginationRangeMovimentacaoOutrosFrascos">0-0</span>

                <button type="button" class="btn btn-pagination" id="modalPaginationPrevMovimentacaoOutrosFrascos" data-tooltip="Página Anterior" aria-label="Página Anterior">
                    <i class="icon" data-lucide="chevron-left"></i>
                </button>

                <button type="button" class="btn btn-pagination" id="modalPaginationNextMovimentacaoOutrosFrascos" data-tooltip="Próxima Página" aria-label="Próxima Página">
                    <i class="icon" data-lucide="chevron-right"></i>
                </button>
            </div>
        </footer>
    </div>
</div>
