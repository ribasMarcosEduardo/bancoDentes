<div class="modal-overlay" id="modalBuscaFrascoMovimentacaoEntrada">
    <div class="modal glass-frost" role="dialog" aria-modal="true" aria-labelledby="modalBuscaFrascoMovimentacaoEntradaTitle">

        <!-- Mesmo miolo de modal_busca_frasco_movimentacao_saida.html
             (busca + filtros + paginação) — só muda o que cada linha de
             resultado oferece: aqui é seleção única (um botão
             Selecionar/Selecionado por linha, sem rolagem de quantidade,
             já que Entrada não escolhe quantidade nesse passo — ver
             setupModalEntrada em frasco-search-movimentacao.js). -->
        <header class="modal__header">
            <h2 id="modalBuscaFrascoMovimentacaoEntradaTitle">
                <i class="icon" data-lucide="search"></i>
                Buscar Frasco
            </h2>

            <button type="button" class="modal__close" id="modalBuscaFrascoMovimentacaoEntradaClose" aria-label="Fechar">
                <i class="icon" data-lucide="x"></i>
            </button>
        </header>

        <div class="modal__body">

            <div class="modal__body-fixed">
                <div class="search-wrapper modal-search">
                    <input type="search" id="modalBuscaFrascoMovimentacaoEntradaInput" placeholder="Buscar por identificador...">

                    <button type="button" class="search-clear" aria-label="Limpar busca" tabindex="-1"></button>
                    <i class="search-icon" data-lucide="search"></i>
                </div>

                <div class="modal-filters">
                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroGrupoMovimentacaoEntrada">
                            <option value="">Grupo dentário</option>
                            <option value="Molar">Molar</option>
                            <option value="Pré-Molar">Pré-Molar</option>
                            <option value="Canino">Canino</option>
                            <option value="Incisivo">Incisivo</option>
                            <option value="Endo">Endo</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroEstadoMovimentacaoEntrada">
                            <option value="">Estado do dente</option>
                            <option value="Hígido">Hígido</option>
                            <option value="Cariado">Cariado</option>
                            <option value="Restaurado">Restaurado</option>
                            <option value="Misto">Misto</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroDenticaoMovimentacaoEntrada">
                            <option value="">Dentição</option>
                            <option value="Permanente">Permanente</option>
                            <option value="Decídua">Decídua</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>
                </div>

                <div class="modal-filters">
                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroStatusMovimentacaoEntrada">
                            <option value="todos" selected>Todos</option>
                            <option value="escolhidos">Já Escolhidos</option>
                            <option value="manutencao">Em Manutenção</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalOrdenarMovimentacaoEntrada">
                            <option value="">Ordenar por</option>
                            <option value="disponivel-asc">Disponível (menor p/ maior)</option>
                            <option value="disponivel-desc">Disponível (maior p/ menor)</option>
                            <option value="manutencao-asc">Manutenção (mais próxima)</option>
                            <option value="manutencao-desc">Manutenção (mais antiga)</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>
                </div>
            </div>

            <div class="modal-results-scroll">
                <div class="modal-results" id="modalBuscaFrascoMovimentacaoEntradaResults">
                    <!-- Linhas de resultado são renderizadas via JS (frasco-search-movimentacao.js) -->
                </div>

                <p class="modal-empty" id="modalBuscaFrascoMovimentacaoEntradaEmpty">
                    Escolha um grupo dentário ou pesquise por um identificador para ver os frascos disponíveis.
                </p>
            </div>
        </div>

        <footer class="modal__footer">
            <span class="modal__footer-hint" id="modalBuscaFrascoMovimentacaoEntradaCount">Nenhuma busca realizada</span>

            <div class="pagination__nav">
                <span class="pagination__range" id="modalPaginationRangeMovimentacaoEntrada">0-0</span>

                <button type="button" class="btn btn-pagination" id="modalPaginationPrevMovimentacaoEntrada" data-tooltip="Página Anterior" aria-label="Página Anterior">
                    <i class="icon" data-lucide="chevron-left"></i>
                </button>

                <button type="button" class="btn btn-pagination" id="modalPaginationNextMovimentacaoEntrada" data-tooltip="Próxima Página" aria-label="Próxima Página">
                    <i class="icon" data-lucide="chevron-right"></i>
                </button>
            </div>
        </footer>
    </div>
</div>
