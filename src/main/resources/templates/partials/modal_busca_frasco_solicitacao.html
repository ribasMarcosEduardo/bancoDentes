<div class="modal-overlay" id="modalBuscaFrasco">
    <div class="modal glass-frost" role="dialog" aria-modal="true" aria-labelledby="modalBuscaFrascoTitle">

        <!-- modal-header-count/-progress: específicos desta tela (ver
             analise_solicitacao.css) — refletem o mesmo progresso de
             .analysis-progress, na página por trás do modal, atualizados
             junto por frasco-search-solicitacao.js. Texto/largura de baixo já nascem
             corretos (renderSelecionados() roda uma vez no load), então
             "0/34" aqui é só o estado inicial antes do JS confirmar. -->
        <header class="modal__header">
            <h2 id="modalBuscaFrascoTitle">
                <i class="icon" data-lucide="search"></i>
                Buscar Frasco
            </h2>

            <span class="modal-header-count" id="modalBuscaFrascoProgressCount">0/34</span>

            <button type="button" class="modal__close" id="modalBuscaFrascoClose" aria-label="Fechar">
                <i class="icon" data-lucide="x"></i>
            </button>

            <div class="modal-header-progress">
                <div class="modal-header-progress__fill" id="modalBuscaFrascoProgressFill" style="width: 0%;"></div>
            </div>
        </header>

        <div class="modal__body">

            <!-- Busca + filtros ficam FORA da área com scroll — sempre
                 visíveis, não somem quando a lista de resultados precisa
                 rolar (ver .modal-results-scroll logo abaixo). -->
            <div class="modal__body-fixed">
                <div class="search-wrapper modal-search">
                    <input type="search" id="modalBuscaFrascoInput" placeholder="Buscar por identificador...">

                    <button type="button" class="search-clear" aria-label="Limpar busca" tabindex="-1"></button>
                    <i class="search-icon" data-lucide="search"></i>
                </div>

                <!-- No projeto completo estas opções (e os próprios frascos
                     listados abaixo) vêm do backend, já filtradas pelas regras
                     da solicitação em análise (grupo/estado/arcada/dentição
                     exigidos). Aqui os selects só filtram o mock local.

                     Grupo dentário/Estado do dente ficam comentados (não
                     removidos) — este modal específico (busca durante a
                     análise de uma solicitação) só precisa de status +
                     ordenação, mas outro modal parecido no futuro pode
                     querer voltar a filtrar por eles; é só descomentar. -->
                <div class="modal-filters">

                    <div class="select-wrapper">
                        <select class="form-control" id="modalFiltroStatus">
                            <option value="todos" selected>Todos</option>
                            <option value="adicionados">Já Adicionados</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>

                    <div class="select-wrapper">
                        <select class="form-control" id="modalOrdenar">
                            <option value="">Ordenar por</option>
                            <option value="disponivel-asc">Disponível (menor p/ maior)</option>
                            <option value="disponivel-desc">Disponível (maior p/ menor)</option>
                            <option value="manutencao-asc">Manutenção (mais próxima)</option>
                            <option value="manutencao-desc">Manutenção (mais antiga)</option>
                        </select>
                        <i class="select-icon icon" data-lucide="chevron-down"></i>
                    </div>
                </div>
            </div>

            <!-- Única parte que rola — altura do .modal é fixa (ver
                 modal.css), então isso é o que sobra depois de header,
                 rodapé e .modal__body-fixed reservarem seu espaço. -->
            <div class="modal-results-scroll">
                <div class="modal-results" id="modalBuscaFrascoResults">
                    <!-- Linhas de resultado são renderizadas via JS (frasco-search-solicitacao.js) -->
                </div>

                <p class="modal-empty" id="modalBuscaFrascoEmpty" hidden>
                    Nenhum frasco encontrado com esses critérios.
                </p>
            </div>
        </div>

        <footer class="modal__footer">
            <span class="modal__footer-hint" id="modalBuscaFrascoCount">0 frascos encontrados</span>

            <!-- Mesmo miolo (pagination__nav + range + setas) da paginação
                 usada nas listas (ver frascos.html) — só sem o wrapper
                 .pagination (que carrega o sticky/glass da barra de
                 página inteira, sem sentido dentro de um rodapé de modal). -->
            <div class="pagination__nav">
                <span class="pagination__range" id="modalPaginationRange">1-1</span>

                <button type="button" class="btn btn-pagination" id="modalPaginationPrev" data-tooltip="Página Anterior" aria-label="Página Anterior">
                    <i class="icon" data-lucide="chevron-left"></i>
                </button>

                <button type="button" class="btn btn-pagination" id="modalPaginationNext" data-tooltip="Próxima Página" aria-label="Próxima Página">
                    <i class="icon" data-lucide="chevron-right"></i>
                </button>
            </div>
        </footer>
    </div>
</div>
