<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#solicitacaoConteudo}, ~{}, ~{})}">
<head>
  <title>Nova Solicitação</title>
</head>
<body class="py-5">

<div id="solicitacaoConteudo" class="container">
  <div class="row justify-content-center mb-3">
    <div class="col-md-10 col-lg-8">
      <div id="alertSucesso" class="alert alert-success alert-dismissible fade show shadow-sm d-none" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>Solicitação enviada com sucesso!</span>
        <button type="button" class="btn-close" onclick="fecharAlerta('alertSucesso')"></button>
      </div>

      <div id="alertErro" class="alert alert-danger alert-dismissible fade show shadow-sm d-none" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="msgErro">Erro ao solicitar.</span>
        <button type="button" class="btn-close" onclick="fecharAlerta('alertErro')"></button>
      </div>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center gap-2 py-3">
          <i class="bi bi-clipboard2-pulse fs-4"></i>
          <h1 class="h5 mb-0">Nova Solicitação</h1>
        </div>

        <div class="card-body p-4">

          <div class="alert alert-info py-2 px-3 mb-4 shadow-sm" style="font-size: 14px;">
            <i class="bi bi-info-circle-fill me-2"></i>
            <strong>Modo de Demonstração:</strong> Esta tela simula a visão de um usuário logado.
          </div>

          <form id="formSolicitacao" th:action="@{/solicitacao/save}" th:object="${solicitacaoDTO}" method="post">

            <input type="hidden" name="codEstudante" th:value="${usuarioLogado.codEstudante}" />
            <input type="hidden" th:field="*{version}"/>

            <p class="section-divider mb-3"><i class="bi bi-person-badge me-1"></i> Seus Dados</p>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Usuário Solicitante</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control bg-light" th:value="${usuarioLogado.nome}" readonly />
                </div>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Seus Créditos Disponíveis</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-coin text-warning"></i></span>
                  <input type="number" id="creditoEstudante" class="form-control bg-light fw-bold" th:value="${usuarioLogado.credito}" readonly />
                </div>
              </div>
            </div>

            <hr class="my-3" />

            <p class="section-divider mb-3"><i class="bi bi-grid-1x2 me-1"></i> Características do dente</p>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Tipo do dente</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-type"></i></span>
                  <select th:field="*{tipoDente}" id="tipoDente" class="form-select" onchange="atualizarCampos(true)" required>
                    <option value="">-- Selecione o Tipo --</option>
                    <option th:each="nome : ${T(bancoDentes.model.enumModels.TipoDente).values()}"
                            th:value="${nome.name()}" th:text="${nome}"></option>
                  </select>
                </div>
              </div>

              <div class="col-md-6 mb-3" id="denticaoContainer">
                <label class="form-label fw-semibold">Dentição</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                  <select th:field="*{denticao}" id="denticao" class="form-select" required>
                    <option value="">-- Selecione a Dentição --</option>
                    <option th:each="d : ${T(bancoDentes.model.enumModels.Denticao).values()}"
                            th:value="${d.name()}" th:text="${d.nome}"></option>
                  </select>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3" id="maxilarContainer">
                <label class="form-label fw-semibold">Maxilar</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-grip-horizontal"></i></span>
                  <select th:field="*{maxilar}" id="maxilar" class="form-select" required>
                    <option value="">-- Selecione o maxilar --</option>
                    <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                            th:value="${m.name()}" th:text="${m}"></option>
                  </select>
                </div>
              </div>

              <div class="col-md-6 mb-3" id="posicaoContainer" style="display: none;">
                <label class="form-label fw-semibold d-block">Posição:</label>
                <div class="p-2 border rounded bg-light">
                  <div id="molarCheckboxes">
                    <strong>Molar:</strong>
                    <div class="form-check form-check-inline" th:each="pos : ${new int[]{1,2,3}}">
                      <input class="form-check-input" type="checkbox" th:field="*{posicao}"
                             th:value="${pos}" th:id="'pos_' + ${pos}">
                      <label class="form-check-label" th:for="'pos_' + ${pos}" th:text="${pos}"></label>
                    </div>
                  </div>
                  <div id="preMolarCheckboxes">
                    <strong>Pré-Molar:</strong>
                    <div class="form-check form-check-inline" th:each="pos : ${new int[]{14,15,24,25,34,35,44,45}}">
                      <input class="form-check-input" type="checkbox" th:field="*{posicao}"
                             th:value="${pos}" th:id="'pos_' + ${pos}">
                      <label class="form-check-label" th:for="'pos_' + ${pos}" th:text="${pos}"></label>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3" id="estadoDenteContainer">
                <label class="form-label fw-semibold">Estado do dente</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-heart-pulse-fill text-danger"></i></span>
                  <select th:field="*{estadoDente}" id="estadoDente" class="form-select" required>
                    <option value="">-- Selecione o estado --</option>
                    <option th:each="e : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                            th:value="${e.name()}" th:text="${e}"></option>
                  </select>
                </div>
              </div>
            </div>

            <hr class="my-3" />

            <p class="section-divider mb-3"><i class="bi bi-123 me-1"></i> Detalhes da Solicitação</p>
            <div class="row">
              <div class="col-md-6 mb-3 align-self-start">
                <label class="form-label fw-semibold">Quantidade solicitada</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-layers"></i></span>
                  <input type="number" th:field="*{quantidade}" id="quantidade" class="form-control" min="1" value="1" oninput="atualizarFeedback()" required />
                </div>
                <div id="creditoFeedback" class="credito-badge credito-ok mt-2 p-2">
                  <i class="bi bi-check-circle-fill me-1"></i> Verificando créditos...
                </div>
              </div>

              <!-- Campo de Justificativa Adicionado Aqui -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Justificativa / Observação</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-pencil-square"></i></span>
                  <textarea th:field="*{justificativa}" id="justificativa" class="form-control" rows="3"
                            placeholder="Ex: Trabalho de Endodontia I, pesquisa científica..." required></textarea>
                </div>
              </div>
            </div>

            <hr class="my-4" />

            <div class="d-flex justify-content-end gap-2">
              <a th:href="@{/solicitacao/painel}" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg me-1"></i> Cancelar
              </a>
              <button type="button" class="btn btn-primary" onclick="validarESubmeter()">
                <i class="bi bi-save me-1"></i> Enviar Solicitação
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script>
    function atualizarFeedback() {
      const credito = parseInt(document.getElementById('creditoEstudante').value) || 0;
      const qtd = parseInt(document.getElementById('quantidade').value) || 0;
      const badge = document.getElementById('creditoFeedback');

      if (qtd > credito) {
        badge.className = 'credito-badge credito-erro p-2';
        badge.innerHTML = `<i class="bi bi-x-circle-fill me-1"></i> Saldo insuficiente (Você tem: ${credito})`;
      } else {
        badge.className = 'credito-badge credito-ok p-2';
        badge.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Saldo suficiente (Você tem: ${credito})`;
      }
    }

    function atualizarCampos(limpar = false) {
      const valor = document.getElementById('tipoDente').value.trim().toUpperCase();
      const isMisto = valor === 'MISTO';
      const isMolar = valor === 'MOLAR';
      const isPreMolar = valor === 'PRE_MOLAR';

      const denticaoContainer = document.getElementById('denticaoContainer');
      const denticao = document.getElementById('denticao');
      const maxilarContainer = document.getElementById('maxilarContainer');
      const maxilar = document.getElementById('maxilar');
      const estadoContainer = document.getElementById('estadoDenteContainer');
      const estado = document.getElementById('estadoDente');
      const posicaoContainer = document.getElementById('posicaoContainer');
      const molarCheckboxes = document.getElementById('molarCheckboxes');
      const preMolarCheckboxes = document.getElementById('preMolarCheckboxes');
      const checkboxes = document.querySelectorAll('#posicaoContainer input[type="checkbox"]');

      if (isMisto) {
        denticaoContainer.style.display = 'none';
        denticao.required = false;
        maxilarContainer.style.display = 'none';
        maxilar.required = false;
        posicaoContainer.style.display = 'none';
        estadoContainer.style.display = 'none';
        estado.required = false;
      } else {
        denticaoContainer.style.display = 'block';
        denticao.required = true;
        maxilarContainer.style.display = 'block';
        maxilar.required = true;
        estadoContainer.style.display = 'block';
        estado.required = true;
        posicaoContainer.style.display = (isMolar || isPreMolar) ? 'block' : 'none';
        molarCheckboxes.style.display = isMolar ? 'block' : 'none';
        preMolarCheckboxes.style.display = isPreMolar ? 'block' : 'none';
      }

      if (limpar) {
        if (isMisto) {
          denticao.value = '';
          maxilar.value = '';
          estado.value = '';
        }
        checkboxes.forEach(cb => cb.checked = false);
      }
    }

    function validarESubmeter() {
      esconderAlertas();

      const credito = parseInt(document.getElementById('creditoEstudante').value) || 0;
      const quantidade = parseInt(document.getElementById('quantidade').value) || 0;
      const tipoDente = document.getElementById('tipoDente').value;
      const justificativa = document.getElementById('justificativa').value.trim();

      if (!tipoDente) return mostrarErro('Selecione o tipo do dente.');

      if (credito < quantidade) {
        return mostrarErro(`Seus créditos são insuficientes para solicitar ${quantidade} dente(s).`);
      }

      // Validação da Justificativa
      if (justificativa.length < 5) {
        return mostrarErro('Por favor, informe uma justificativa válida (mínimo 5 caracteres).');
      }

      document.getElementById('formSolicitacao').submit();
    }

    function mostrarErro(msg) {
      document.getElementById('msgErro').textContent = msg;
      const el = document.getElementById('alertErro');
      el.classList.remove('d-none');
      // Scroll para o topo para ver o erro
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function esconderAlertas() {
      document.getElementById('alertSucesso').classList.add('d-none');
      document.getElementById('alertErro').classList.add('d-none');
    }

    function fecharAlerta(id) {
      document.getElementById(id).classList.add('d-none');
    }

    document.addEventListener('DOMContentLoaded', () => {
      atualizarFeedback();
      atualizarCampos(false);
    });
  </script>

</div>
</body>
</html>
