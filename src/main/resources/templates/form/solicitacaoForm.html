<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/pages/cadastro_frasco.css}">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <title>Nova Solicitação</title>
</head>

<body>

<div id="solicitacaoConteudo">

  <div class="background">
    <div class="blob blob--blue"></div>
    <div class="blob blob--green"></div>
  </div>

  <div th:replace="~{partials/navbar :: navbar}"></div>

  <main class="page">
    <section class="form-shell">

      <header class="page-header">
        <h1>Nova Solicitação</h1>
        <p>Preencha os dados da solicitação de acordo com o necessário para sua atividade prática.</p>
      </header>

      <div class="toolbar glass-soft">
        <div class="toolbar__info">
          <span class="toolbar__label">Saldo Disponível:</span>
          <div class="toolbar__badge" th:text="${usuarioLogado.credito}">0</div>
          <input type="hidden" id="creditoEstudante" th:value="${usuarioLogado.credito}">
        </div>

        <div class="toolbar__actions">
          <a th:href="@{/solicitacao/painel}" class="btn btn-secondary">
            Cancelar
          </a>
          <button type="button" class="btn btn-primary" onclick="validarESubmeter()">
            Enviar Solicitação
          </button>
        </div>
      </div>

      <form id="formSolicitacao" class="form-card" th:action="@{/solicitacao/save}" th:object="${solicitacaoDTO}" method="post">
        <input type="hidden" name="codEstudante" th:value="${usuarioLogado.codEstudante}" />
        <input type="hidden" th:field="*{version}"/>

        <section class="form-section">
          <div class="form-group">
            <label>Tipo do dente (Grupo dentário)</label>
            <div class="select-wrapper">
              <select class="form-control" th:field="*{tipoDente}" id="tipoDente" onchange="atualizarCampos(true)" required>
                <option value="">- Selecione o Tipo -</option>
                <option th:each="nome : ${T(bancoDentes.model.enumModels.TipoDente).values()}"
                        th:value="${nome.name()}" th:text="${nome}"></option>
              </select>
              <i class="select-icon icon" data-lucide="chevron-down"></i>
            </div>
          </div>
        </section>

        <section class="form-section form-section--disabled" id="estadoFrascoSection">
          <div class="form-grid-estado">
            <div class="form-group" id="estadoGroup">
              <label>Estado do dente</label>
              <div class="select-wrapper">
                <select class="form-control" th:field="*{estadoDente}" id="estadoDente" required disabled>
                  <option value="" disabled selected>- Selecione o Estado -</option>
                  <option th:each="e : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                          th:value="${e.name()}" th:text="${e}"></option>
                </select>
                <i class="select-icon icon" data-lucide="chevron-down"></i>
              </div>
            </div>

            <div class="form-group form-group--disabled" id="quantidadeGroup">
              <label>Quantidade</label>
              <div class="quantidade-inline">
                <div class="number-input">
                  <input class="form-control number-input__field" type="number" th:field="*{quantidade}" min="1" value="1" id="quantidade" disabled oninput="atualizarFeedback()">
                  <div class="number-input__actions">
                    <button type="button" class="number-input__btn quantidade-control" data-number-action="down" disabled>
                      <i class="icon" data-lucide="minus"></i>
                    </button>
                    <button type="button" class="number-input__btn quantidade-control" data-number-action="up" disabled>
                      <i class="icon" data-lucide="plus"></i>
                    </button>
                  </div>
                </div>
              </div>
              <small id="creditoFeedbackText" style="color: #dc3545; display: none; margin-top: 8px; font-weight: 500;"></small>
            </div>
          </div>
        </section>

        <section class="form-section form-section--disabled" id="atributosFrascoSection">
          <div class="form-grid">
            <div class="form-group" id="maxilarContainer">
              <label>Arcada</label>
              <div class="select-wrapper">
                <select class="form-control atributos-control" th:field="*{maxilar}" id="maxilar" disabled required>
                  <option value="">Não Informado</option>
                  <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                          th:value="${m.name()}" th:text="${m}"></option>
                </select>
                <i class="select-icon icon" data-lucide="chevron-down"></i>
              </div>
            </div>

            <div class="form-group" id="denticaoContainer">
              <label>Dentição</label>
              <div class="select-wrapper">
                <select class="form-control atributos-control" th:field="*{denticao}" id="denticao" disabled required>
                  <option value="">Não Informado</option>
                  <option th:each="d : ${T(bancoDentes.model.enumModels.Denticao).values()}"
                          th:value="${d.name()}" th:text="${d.nome}"></option>
                </select>
                <i class="select-icon icon" data-lucide="chevron-down"></i>
              </div>
            </div>
          </div>
        </section>

        <section class="form-section" id="posicaoContainer" style="display: none;">
          <div class="form-group">
            <label>Posição do Dente</label>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; padding: 12px; background: rgba(255, 255, 255, 0.5); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.1);">

              <div id="molarCheckboxes" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label class="checkbox-filter" th:each="pos : ${new int[]{1,2,3}}">
                  <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                  <span th:text="${pos}"></span>
                </label>
              </div>

              <div id="preMolarCheckboxes" style="display: flex; gap: 10px; flex-wrap: wrap;">
                <label class="checkbox-filter" th:each="pos : ${new int[]{14,15,24,25,34,35,44,45}}">
                  <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                  <span th:text="${pos}"></span>
                </label>
              </div>

            </div>
          </div>
        </section>

        <section class="form-section">
          <div class="form-group">
            <label>Justificativa / Observação</label>
            <textarea class="form-control" th:field="*{justificativa}" id="justificativa" rows="3" placeholder="Ex: Trabalho de Endodontia I, pesquisa científica..." required style="resize: vertical; padding: 12px; min-height: 100px;"></textarea>
          </div>
        </section>

      </form>
    </section>
  </main>

  <div th:replace="~{partials/footer :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script th:src="@{/js/includes.js}"></script>
  <script th:src="@{/js/solicitacao.js}"></script>

</div>
</body>
</html>
