<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Solicitação de Dentes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Solicitação de Dentes</h3>
    </div>
    <div class="card-body">

      <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
      <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

      <form th:action="@{/solicitacao/save}" th:object="${solicitacaoDTO}" method="post">

        <div class="mb-4">
          <label class="form-label fw-bold">ID do Estudante (Padrão: 1)</label>
          <input type="number" th:field="*{codEstudante}" class="form-control" style="width: 120px;">
        </div>

        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
          <h5 class="mb-0">Dentes Solicitados</h5>
          <button type="button" class="btn btn-sm btn-success" onclick="adicionarLinha()">
            <i class="bi bi-plus-lg"></i> Adicionar Dente
          </button>
        </div>

        <table class="table" id="tabelaItens">
          <thead class="table-light">
          <tr>
            <th style="width: 50%;">Frasco (Dente)</th>
            <th style="width: 20%;">Disponível</th>
            <th style="width: 20%;">Quantidade</th>
            <th style="width: 50px;"></th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td>
              <select name="itens[0].codFrasco" class="form-select select-frasco" required onchange="atualizarMaximo(this)">
                <option value="" data-max="0">-- Selecione --</option>
                <option th:each="f : ${frascos}"
                        th:value="${f.codigo}"
                        th:data-max="${f.quantidade}"
                        th:text="${f.identificacao} + ' - ' + ${f.nomDente}"></option>
              </select>
            </td>
            <td>
              <span class="badge bg-info text-dark span-max">0</span> unidades
            </td>
            <td>
              <input type="number" name="itens[0].quantidade" class="form-control input-qtd"
                     value="1" min="1" max="0" required oninput="validarQtd(this)">
            </td>
            <td></td>
          </tr>
          </tbody>
        </table>

        <div class="d-flex justify-content-end mt-4 gap-2">
          <a th:href="@{/frasco/painel}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary px-5">Finalizar Solicitação</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script th:inline="javascript">
  let contadorItens = 1;

  function atualizarMaximo(selectElement) {
      const linha = selectElement.closest('tr');
      const valorSelecionado = selectElement.value;

      // --- NOVA LÓGICA DE VALIDAÇÃO DE DUPLICIDADE ---
      if (valorSelecionado !== "") {
          const todosSelects = document.querySelectorAll('.select-frasco');
          let duplicado = false;

          todosSelects.forEach(s => {
              // Verifica se outro select (não o atual) tem o mesmo valor
              if (s !== selectElement && s.value === valorSelecionado) {
                  duplicado = true;
              }
          });

          if (duplicado) {
              alert("Este frasco já foi selecionado em outra linha. Escolha um frasco diferente ou ajuste a quantidade da linha existente.");
              selectElement.value = ""; // Reseta o select
              linha.querySelector('.span-max').innerText = "0";
              linha.querySelector('.input-qtd').max = "0";
              return; // Interrompe a execução
          }
      }
      // -----------------------------------------------

      const optionSelecionada = selectElement.options[selectElement.selectedIndex];
      const maximo = optionSelecionada.getAttribute('data-max') || 0;

      const spanMax = linha.querySelector('.span-max');
      const inputQtd = linha.querySelector('.input-qtd');

      spanMax.innerText = maximo;
      inputQtd.max = maximo;

      if (parseInt(inputQtd.value) > parseInt(maximo)) {
          inputQtd.value = maximo;
      }
  }

  function validarQtd(input) {
      const max = parseInt(input.max);
      if (parseInt(input.value) > max) {
          alert("Quantidade indisponível em estoque! Limite: " + max);
          input.value = max;
      }
  }

  function adicionarLinha() {
      const tabela = document.getElementById('tabelaItens').getElementsByTagName('tbody')[0];
      const novaLinha = tabela.insertRow();

      // Buscamos o HTML original do primeiro select (que contém todos os dentes do banco)
      const optionsHtml = document.querySelector('.select-frasco').innerHTML;

      novaLinha.innerHTML = `
          <td>
              <select name="itens[${contadorItens}].codFrasco" class="form-select select-frasco" required onchange="atualizarMaximo(this)">
                  ${optionsHtml}
              </select>
          </td>
          <td>
              <span class="badge bg-info text-dark span-max">0</span> unidades
          </td>
          <td>
              <input type="number" name="itens[${contadorItens}].quantidade" class="form-control input-qtd"
                     value="1" min="1" max="0" required oninput="validarQtd(this)">
          </td>
          <td>
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="removerLinha(this)">
                  <i class="bi bi-trash"></i>
              </button>
          </td>
      `;
      contadorItens++;
  }

  function removerLinha(botao) {
      botao.closest('tr').remove();
  }
</script>

</body>
</html>
