<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script th:if="${mensagemSucesso}">
        showToast('[[${mensagemSucesso}]]');
    </script>

    <script>
        (function () {
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var theme = localStorage.getItem("theme") || (prefersDark ? "dark" : "light");
            document.documentElement.classList.add(theme);
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/vendor/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages/cadastro_frasco.css}">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <title>Cadastro de Frasco</title>
</head>

<body>

<div class="background">
    <div class="blob blob--blue"></div>
    <div class="blob blob--green"></div>
</div>

<div th:replace="~{partials/navbar :: navbar}"></div>

<main class="page">
    <section class="form-shell">

        <header class="page-header">
            <h1 th:text="${frascoDTO.codigo != null} ? 'Edição de Frasco' : 'Cadastro de Frasco'">Cadastro de Frasco</h1>
            <p>Preencha os dados para registrar um novo frasco no sistema.</p>
        </header>

        <div class="toolbar glass-frost">
            <div class="toolbar__info">
                <span class="toolbar__label">Identificador do Frasco:</span>
                <div class="toolbar__badge" th:text="${frascoDTO.codigo != null} ? '#' + ${frascoDTO.identificacao} : '---'">
                    ---
                </div>
            </div>

            <div class="toolbar__actions">
                <a th:href="@{/frasco/painel}" class="btn btn-secondary">Cancelar</a>

                <button type="submit" class="btn btn-tonal" id="salvarContinuarBtn" form="cadastroFrascoForm">
                    Salvar e Continuar
                </button>

                <button type="submit" class="btn btn-primary" id="salvarSairBtn" form="cadastroFrascoForm">
                    Salvar e Sair
                </button>
            </div>
        </div>

        <form class="form-card" id="cadastroFrascoForm" th:action="@{/frasco/save}" th:object="${frascoDTO}" method="post">
            <input type="hidden" th:field="*{codigo}"/>
            <input type="hidden" th:field="*{version}"/>

            <section class="form-section">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Grupo dentário <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{tipoDente}" id="tipoDente" required>

                                <option value="">- Selecione o grupo -</option>
                                <option th:each="nome : ${T(bancoDentes.model.enumModels.TipoDente).values()}"
                                        th:value="${nome.name()}" th:text="${nome}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Local <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" id="localFrasco">
                                <option value="bdh" selected>Banco de Dentes Humanos</option>
                                <option value="biobanco">Biobanco</option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section" id="estadoFrascoSection">
                <div class="form-grid-estado">
                    <div class="form-group">
                        <label>Estado do dente <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{estadoDente}" id="estadoDente" required>
                                <option value="">- Selecione o Estado -</option>
                                <option th:each="estado : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                                        th:value="${estado.name()}" th:text="${estado}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group" id="quantidadeGroup">
                        <label>Quantidade <span class="required-mark">*</span></label>
                        <div class="number-input number-input--compact">
                            <input class="form-control number-input__field" type="number" th:field="*{quantidade}" id="quantidade" min="1" required>
                            <div class="number-input__actions">
                                <button type="button" class="number-input__btn quantidade-control" data-number-action="down">
                                    <i class="icon" data-lucide="minus"></i>
                                </button>
                                <button type="button" class="number-input__btn quantidade-control" data-number-action="up">
                                    <i class="icon" data-lucide="plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section" id="posicaoContainer" style="display: none;">
                <div class="form-group">
                    <label>Numeração do Dente <span class="optional-mark">*</span></label>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; padding: 12px; background: rgba(255, 255, 255, 0.5); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.1);">

                        <div id="molarCheckboxes" style="display: flex; flex-direction: column; gap: 5px;">
                            <strong>Molar:</strong>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <label class="checkbox-filter" th:each="pos : ${new int[]{1,2,3}}">
                                    <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                                    <span th:text="${pos}"></span>
                                </label>
                            </div>
                        </div>

                        <div id="preMolarCheckboxes" style="display: flex; flex-direction: column; gap: 5px;">
                            <strong>Pré-Molar:</strong>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <label class="checkbox-filter" th:each="pos : ${new int[]{14,15,24,25,34,35,44,45}}">
                                    <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                                    <span th:text="${pos}"></span>
                                </label>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            <section class="form-section" id="atributosFrascoSection">
                <div class="form-grid">
                    <div class="form-group" id="denticaoGroup">
                        <label>Dentição <span class="optional-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control atributos-control" th:field="*{denticao}" id="denticao">
                                <option value="" selected>Não Informado</option>
                                <option th:each="d : ${T(bancoDentes.model.enumModels.Denticao).values()}"
                                        th:value="${d.name()}" th:text="${d.nome}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group" id="arcadaGroup">
                        <label>Arcada <span class="optional-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control atributos-control" th:field="*{maxilar}" id="maxilar">
                                <option value="" selected>Não Informado</option>
                                <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                                        th:value="${m.name()}" th:text="${m}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Data de cadastro <span class="required-mark">*</span></label>
                        <div class="date-wrapper">
                            <input class="form-control atributos-control"
                                   type="date"
                                   id="datCad"
                                   name="datCad"
                                   th:value="${frascoDTO.datCad != null ? #temporals.format(frascoDTO.datCad, 'yyyy-MM-dd') : ''}"
                                   required>
                            <button type="button" class="date-icon-trigger atributos-control" data-tooltip="Mostrar seletor de datas" aria-label="Mostrar seletor de datas">
                                <i class="date-icon icon" data-lucide="calendar-days" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Data de manutenção <span class="required-mark">*</span></label>
                        <div class="date-wrapper">

                            <input class="form-control atributos-control"
                                   type="datetime-local"
                                   th:field="*{datManutencao}"
                                   id="datManutencao"
                                   readonly>
                            <button type="button" class="date-icon-trigger atributos-control" data-tooltip="Mostrar seletor de datas" aria-label="Mostrar seletor de datas">
                                <i class="date-icon icon" data-lucide="calendar-days" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <p class="form-legend">
                <span class="required-mark">*</span><span class="form-legend__label">Preenchimento</span><span class="form-legend__value">Obrigatório.</span>
                <span class="optional-mark">*</span><span class="form-legend__label">Preenchimento</span><span class="form-legend__value">Opcional.</span>
            </p>
        </form>
    </section>
</main>

<div th:replace="~{partials/footer :: footer}"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script  th:src="@{/js/vendor/sweetalert2.min.js}"></script>
<script  th:src="@{/js/includes.js}"></script>
<script  th:src="@{/js/forms.js}"></script>

</body>
</html>
