<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        // Aplica o tema salvo ANTES do primeiro paint
        (function () {
            var theme = localStorage.getItem("theme") || "light";
            document.documentElement.classList.add(theme);
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages/cadastro_frasco.css}">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <title>Cadastro de Frasco</title>
</head>

<body>

<div id="frascoConteudo">

    <div class="background">
        <div class="blob blob--blue"></div>
        <div class="blob blob--green"></div>
    </div>

    <div th:replace="~{partials/navbar :: navbar}"></div>

    <main class="page">
        <section class="form-shell">

            <div th:if="${mensagemSucesso}" class="alert-box success" style="margin-bottom: 20px; padding: 15px; border-radius: 8px; background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745;">
                <span th:text="${mensagemSucesso}"></span>
            </div>
            <div th:if="${mensagemErro}" class="alert-box error" style="margin-bottom: 20px; padding: 15px; border-radius: 8px; background: rgba(220, 53, 69, 0.2); color: #dc3545; border: 1px solid #dc3545;">
                <span th:text="${mensagemErro}"></span>
            </div>

            <header class="page-header">
                <h1 th:text="${frascoDTO.codigo != null} ? 'Edição de Frasco' : 'Cadastro de Frasco'">Cadastro de Frasco</h1>
                <p>Preencha os dados abaixo para registrar as características do dente e armazenar o frasco no sistema.</p>
            </header>

            <div class="toolbar glass-frost">
                <div class="toolbar__info">
                    <span class="toolbar__label">Identificação:</span>
                    <div class="toolbar__badge" th:text="${frascoDTO.codigo != null} ? '#' + ${frascoDTO.identificacao} : 'Novo Frasco'">
                        ---
                    </div>
                </div>

                <div class="toolbar__actions">
                    <a th:href="@{/frasco/painel}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" form="formFrasco" class="btn btn-primary">Salvar Frasco</button>
                </div>
            </div>

            <form id="formFrasco" class="form-card" th:action="@{/frasco/save}" th:object="${frascoDTO}" method="post">
                <input type="hidden" th:field="*{codigo}"/>
                <input type="hidden" th:field="*{version}"/>

                <section class="form-section">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Data de Cadastro <span class="required-mark">*</span></label>
                            <div class="date-wrapper">
                                <input class="form-control"
                                       type="date"
                                       id="datCad"
                                       name="datCad"
                                       th:value="${frascoDTO.datCad != null ? #temporals.format(frascoDTO.datCad, 'yyyy-MM-dd') : ''}"
                                       required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Data de Manutenção</label>
                            <div class="date-wrapper">
                                <input class="form-control"
                                       type="datetime-local"
                                       th:field="*{datManutencao}"
                                       id="datManutencao"
                                       readonly>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <div class="form-group">
                        <label>Tipo do Dente <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{tipoDente}" id="tipoDente" required>
                                <option value="">- Selecione o Tipo -</option>
                                <option th:each="nome : ${T(bancoDentes.model.enumModels.TipoDente).values()}"
                                        th:value="${nome.name()}" th:text="${nome}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>
                </section>

                <section class="form-section" id="atributosContainer">
                    <div class="form-grid">
                        <div class="form-group" id="denticaoContainer">
                            <label>Dentição <span class="required-mark">*</span></label>
                            <div class="select-wrapper">
                                <select class="form-control" th:field="*{denticao}" id="denticao" required>
                                    <option value="">- Selecione a Dentição -</option>
                                    <option th:each="d : ${T(bancoDentes.model.enumModels.Denticao).values()}"
                                            th:value="${d.name()}" th:text="${d.nome}"></option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>
                        </div>

                        <div class="form-group" id="maxilarContainer">
                            <label>Maxilar <span class="required-mark">*</span></label>
                            <div class="select-wrapper">
                                <select class="form-control" th:field="*{maxilar}" id="maxilar" required>
                                    <option value="">- Selecione o Maxilar -</option>
                                    <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                                            th:value="${m.name()}" th:text="${m}"></option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="form-section" id="posicaoContainer" style="display: none;">
                    <div class="form-group">
                        <label>Posição do Dente</label>
                        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 8px; padding: 12px; background: rgba(255, 255, 255, 0.5); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.1);">

                            <div id="molarCheckboxes" style="display: flex; flex-direction: column; gap: 5px;">
                                <strong>Molar:</strong>
                                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                    <label class="checkbox-filter" th:each="pos : ${new int[]{1,2,3}}">
                                        <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                                        <span th:text="${pos}"></span>
                                    </label>
                                </div>
                            </div>

                            <div id="preMolarCheckboxes" style="display: flex; flex-direction: column; gap: 5px;">
                                <strong>Pré-Molar:</strong>
                                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                    <label class="checkbox-filter" th:each="pos : ${new int[]{14,15,24,25,34,35,44,45}}">
                                        <input type="checkbox" th:field="*{posicao}" th:value="${pos}">
                                        <span th:text="${pos}"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="form-section" id="estadoFrascoSection">
                    <div class="form-grid-estado">
                        <div class="form-group" id="estadoDenteContainer">
                            <label>Estado do dente <span class="required-mark">*</span></label>
                            <div class="select-wrapper">
                                <select class="form-control" th:field="*{estadoDente}" id="estadoDente" required>
                                    <option value="">- Selecione o Estado -</option>
                                    <option th:each="estado : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                                            th:value="${estado.name()}" th:text="${estado}"></option>
                                </select>
                                <i class="select-icon icon" data-lucide="chevron-down"></i>
                            </div>
                        </div>

                        <div class="form-group" id="quantidadeGroup">
                            <label>Quantidade <span class="required-mark">*</span></label>
                            <div class="quantidade-inline">
                                <div class="number-input">
                                    <input class="form-control number-input__field" type="number" th:field="*{quantidade}" id="quantidade" min="1" required>
                                    <div class="number-input__actions">
                                        <button type="button" class="number-input__btn quantidade-control" data-number-action="down">
                                            <i class="icon" data-lucide="minus"></i>
                                        </button>
                                        <button type="button" class="number-input__btn quantidade-control" data-number-action="up">
                                            <i class="icon" data-lucide="plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <p class="form-legend">
                    <span class="required-mark">*</span><span class="form-legend__label">Preenchimento</span><span class="form-legend__value">Obrigatório.</span>
                </p>

            </form>
        </section>
    </main>

    <div th:replace="~{partials/footer :: footer}"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/includes.js}"></script>
    <script th:src="@{/js/forms.js}"></script>

    <!-- Lógica Específica desta tela (Seu código Javascript adaptado) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); // Força a renderização dos ícones do Lucide

            const elements = {
                datCad: document.getElementById('datCad'),
                datManutencao: document.getElementById('datManutencao'),
                tipoDente: document.getElementById('tipoDente'),

                atributosContainer: document.getElementById('atributosContainer'),
                denticaoContainer: document.getElementById('denticaoContainer'),
                denticao: document.getElementById('denticao'),
                maxilarContainer: document.getElementById('maxilarContainer'),
                maxilar: document.getElementById('maxilar'),

                posicaoContainer: document.getElementById('posicaoContainer'),
                molarCheckboxes: document.getElementById('molarCheckboxes'),
                preMolarCheckboxes: document.getElementById('preMolarCheckboxes'),
                checkboxes: document.querySelectorAll('#posicaoContainer input[type="checkbox"]'),

                estadoDenteContainer: document.getElementById('estadoDenteContainer'),
                estadoDente: document.getElementById('estadoDente')
            };

            const calcularDataManutencao = () => {
                if (!elements.datCad.value) return;

                const dataCadastro = new Date(elements.datCad.value);
                if (isNaN(dataCadastro)) {
                    elements.datManutencao.value = '';
                    return;
                }
                dataCadastro.setFullYear(dataCadastro.getFullYear() + 1);
                elements.datManutencao.value = dataCadastro.toISOString().slice(0, 16);
            };

            const atualizarCampos = (limpar = false) => {
                const valor = elements.tipoDente.value.trim().toUpperCase();

                const isMolar = valor === 'MOLAR';
                const isPreMolar = valor === 'PRE_MOLAR';
                const isMisto = valor === 'MISTO';

                if (isMisto) {
                    // Oculta blocos inteiros
                    elements.atributosContainer.style.display = 'none';
                    elements.denticao.required = false;
                    elements.maxilar.required = false;

                    elements.posicaoContainer.style.display = 'none';

                    elements.estadoDenteContainer.style.display = 'none';
                    elements.estadoDente.required = false;
                } else {
                    // Mostra blocos
                    elements.atributosContainer.style.display = 'block';
                    elements.denticao.required = true;
                    elements.maxilar.required = true;

                    elements.posicaoContainer.style.display = (isMolar || isPreMolar) ? 'block' : 'none';
                    elements.molarCheckboxes.style.display = isMolar ? 'flex' : 'none';
                    elements.preMolarCheckboxes.style.display = isPreMolar ? 'flex' : 'none';

                    elements.estadoDenteContainer.style.display = 'block';
                    elements.estadoDente.required = true;
                }

                if (limpar) {
                    if (isMisto) {
                        elements.denticao.value = '';
                        elements.maxilar.value = '';
                        elements.estadoDente.value = '';
                    }
                    elements.checkboxes.forEach(cb => cb.checked = false);
                }
            };

            // Listeners
            if(elements.datCad) {
                elements.datCad.addEventListener('change', calcularDataManutencao);
            }

            if(elements.tipoDente){
                elements.tipoDente.addEventListener('change', () => atualizarCampos(true));
                atualizarCampos(false);
            }

            if(elements.datCad && elements.datCad.value) {
                 calcularDataManutencao();
            }

            // Timer para fechar os alertas customizados após 5 segundos
            setTimeout(() => {
                const alerts = document.querySelectorAll('.alert-box');
                alerts.forEach(alert => {
                    alert.style.transition = "opacity 0.5s ease";
                    alert.style.opacity = "0";
                    setTimeout(() => alert.remove(), 500); // Remove do DOM após o fade
                });
            }, 5000);
        });
    </script>
</div>
</body>
</html>
