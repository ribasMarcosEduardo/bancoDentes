<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script>
        (function () {
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var theme = localStorage.getItem("theme") || (prefersDark ? "dark" : "light");
            document.documentElement.classList.add(theme, "carregando");
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/vendor/sweetalert2.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/pages/cadastro_frasco.css}">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <title>Cadastro de Frasco</title>
</head>

<body class="app-mobile app-cadastro">

<div class="background">
    <div class="blob blob--blue"></div>
    <div class="blob blob--green"></div>
</div>

<div th:replace="~{partials/navbar :: navbar}"></div>
<th:block th:with="appVoltar=@{/frasco/painel}">
    <div th:replace="~{partials/app_mobile :: appHeader('')}"></div>
</th:block>

<main class="page page--compact">
    <section class="form-shell">

        <div class="toolbar glass-frost">
            <div class="toolbar__lead">
                <h1 class="toolbar__title" th:text="${frascoDTO.codigo != null} ? 'Edição de Frasco' : 'Cadastro de Frasco'">Cadastro de Frasco</h1>

                <div class="toolbar__identity">
                    <span class="toolbar__identity-icon" aria-hidden="true">
                        <i class="icon" data-lucide="flask-conical"></i>
                    </span>

                    <div class="toolbar__identity-text">
                        <span class="toolbar__identity-label">Identificador</span>
                        <span class="toolbar__identity-value" id="identificadorFrasco"
                              th:classappend="${frascoDTO.codigo == null} ? 'toolbar__identity-value--pending'"
                              th:text="${frascoDTO.codigo != null} ? ${frascoDTO.identificacao} : 'Gerado ao salvar'">Gerado ao salvar</span>
                    </div>
                </div>
            </div>

            <div class="toolbar__actions">
                <a th:href="@{/frasco/painel}" class="btn btn-ghost">
                    <span class="btn__label">Cancelar</span>
                    <i class="orderBy-icon" data-lucide="x"></i>
                </a>

                <button type="submit" class="btn btn-tonal" id="salvarContinuarBtn" form="cadastroFrascoForm">
                    Salvar e Continuar
                </button>

                <button type="submit" class="btn btn-primary" id="salvarSairBtn" form="cadastroFrascoForm">
                    Salvar e Sair
                </button>
            </div>
        </div>

        <form class="form-card" id="cadastroFrascoForm" th:action="@{/frasco/save}" th:object="${frascoDTO}" method="post">
            <input type="hidden" th:field="*{codigo}"/>
            <input type="hidden" th:field="*{version}"/>

            <div class="cadastro-topo">
                <h2 class="cadastro-titulo">
                    <i class="icon" data-lucide="flask-conical" aria-hidden="true"></i>
                    <span th:text="${frascoDTO.codigo != null} ? 'Editar frasco' : 'Cadastrar frasco'">Cadastrar frasco</span>
                </h2>

                <nav class="app-tabs cadastro-abas" data-select="#localFrasco" aria-label="Local">
                    <span class="app-tabs__indicator"></span>
                    <button type="button" class="app-tabs__btn"
                            th:each="l : ${T(bancoDentes.model.enumModels.Local).values()}"
                            th:data-valor="${l.name()}"
                            th:text="${l.name() == 'BDH'} ? 'Banco de Dentes' : ${l.nome}"></button>
                </nav>
            </div>

            <section class="form-section">
                <h2 class="form-section__title"><i class="icon" data-lucide="flask-conical" aria-hidden="true"></i>Informações do Frasco</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Grupo dentário <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{tipoDente}" id="tipoDente" required aria-describedby="grupoDentarioHint">
                                <option value="">Selecione o grupo</option>
                                <option th:each="nome : ${T(bancoDentes.model.enumModels.TipoDente).values()}"
                                        th:value="${nome.name()}" th:data-sigla="${nome.sigla}" th:text="${nome}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>

                        <p class="field-hint field-hint--icon" id="grupoDentarioHint"><i class="icon" data-lucide="info" aria-hidden="true"></i>Escolha o grupo para liberar os demais campos.</p>
                    </div>

                    <div class="form-group" id="localGroup">
                        <label>Local</label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{local}" id="localFrasco">
                                <option th:each="l : ${T(bancoDentes.model.enumModels.Local).values()}"
                                        th:value="${l.name()}" th:data-sigla="${l.sigla}" th:text="${l}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section form-section--continued form-section--disabled" id="estadoFrascoSection">
                <div class="form-grid-estado">
                    <div class="form-group" id="estadoDenteGroup">
                        <label>Estado do dente <span class="required-mark">*</span></label>
                        <div class="select-wrapper">
                            <select class="form-control" th:field="*{estadoDente}" id="estadoDente" required disabled>
                                <option th:each="estado : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                                        th:value="${estado.name()}" th:text="${estado}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group form-group--disabled" id="quantidadeGroup">
                        <label>Quantidade</label>
                        <div class="number-input number-input--compact">
                            <input class="form-control number-input__field" type="number" name="quantidade" id="quantidade" th:value="${frascoDTO.quantidade != null ? frascoDTO.quantidade : 1}" min="1" disabled>
                            <div class="number-input__actions">
                                <button type="button" class="number-input__btn quantidade-control" data-number-action="down" disabled>
                                    <i class="icon" data-lucide="minus"></i>
                                </button>
                                <button type="button" class="number-input__btn quantidade-control" data-number-action="up" disabled>
                                    <i class="icon" data-lucide="plus"></i>
                                </button>
                            </div>
                        </div>
                        <p class="field-hint field-hint--icon" th:if="${frascoDTO.codigo != null}"><i class="icon" data-lucide="info" aria-hidden="true"></i>Para alterar a quantidade, registre uma movimentação.</p>
                    </div>

                    <div class="form-group cadastro-opcionais">
                        <label for="opcionaisToggle">Campos opcionais</label>
                        <div class="cadastro-opcionais__campo">
                            <i class="icon" data-lucide="sliders-horizontal" aria-hidden="true"></i>
                            <input type="checkbox" class="switch" id="opcionaisToggle">
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-section form-section--disabled" id="atributosFrascoSection">
                <h2 class="form-section__title"><i class="icon" data-lucide="calendar-days" aria-hidden="true"></i>Detalhes e datas</h2>

                <div class="form-grid">
                    <div class="form-group" id="denticaoGroup">
                        <label>Dentição <span class="optional-mark">(opcional)</span></label>
                        <div class="select-wrapper">
                            <select class="form-control atributos-control" th:field="*{denticao}" id="denticao" disabled>
                                <option th:each="d : ${T(bancoDentes.model.enumModels.Denticao).values()}"
                                        th:value="${d.name()}" th:text="${d.nome}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group" id="arcadaGroup">
                        <label>Arcada <span class="optional-mark">(opcional)</span></label>
                        <div class="select-wrapper">
                            <select class="form-control atributos-control" th:field="*{arcada}" id="arcada" disabled>
                                <option th:each="m : ${T(bancoDentes.model.enumModels.Arcada).values()}"
                                        th:value="${m.name()}" th:text="${m}"></option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group" id="numeracaoGroup" hidden>
                        <label>Numeração <span class="optional-mark">(opcional)</span></label>
                        <div class="select-wrapper">
                            <select class="form-control atributos-control" th:field="*{posicao}" id="numeracaoSelect" th:data-valor-inicial="${frascoDTO.posicao}">
                                <option value="">Selecione a dentição</option>
                            </select>
                            <i class="select-icon icon" data-lucide="chevron-down"></i>
                        </div>
                        <p class="field-hint" id="numeracaoHint"></p>
                    </div>

                    <div class="form-group" id="datCadGroup">
                        <label><span class="rotulo-longo">Data de cadastro</span><span class="rotulo-curto">Cadastro</span> <span class="required-mark">*</span></label>
                        <div class="date-wrapper">
                            <input class="form-control atributos-control"
                                   type="date"
                                   id="datCad"
                                   name="datCad"
                                   th:value="${frascoDTO.datCad != null ? #temporals.format(frascoDTO.datCad, 'yyyy-MM-dd') : ''}"
                                   required disabled>
                            <button type="button" class="date-icon-trigger atributos-control" data-tooltip="Mostrar seletor de datas" aria-label="Mostrar seletor de datas" disabled>
                                <i class="date-icon icon" data-lucide="calendar-days" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group" id="datManutencaoGroup">
                        <label><span class="rotulo-longo">Data de manutenção</span><span class="rotulo-curto">Manutenção</span> <span class="required-mark">*</span></label>
                        <div class="date-wrapper">
                            <input class="form-control atributos-control"
                                   type="date"
                                   name="datManutencao"
                                   id="datManutencao"
                                   th:value="${frascoDTO.datManutencao != null ? #temporals.format(frascoDTO.datManutencao, 'yyyy-MM-dd') : ''}"
                                   required disabled>

                            <button type="button" class="date-icon-trigger atributos-control" data-tooltip="Mostrar seletor de datas" aria-label="Mostrar seletor de datas" disabled>
                                <i class="date-icon icon" data-lucide="calendar-days" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <p class="form-legend form-legend--simple">
              <span class="required-mark">*</span> Campos obrigatórios
            </p>
        </form>
    </section>
</main>

<div th:replace="~{partials/footer :: footer}"></div>
<script th:src="@{/js/bundles/form.js}"></script>
<script th:src="@{/js/app-mobile.js}"></script>

</body>
</html>
