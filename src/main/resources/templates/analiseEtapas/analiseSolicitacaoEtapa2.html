<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          ~{::title},
          ~{::#etapa2Conteudo},
          ~{},
          ~{::#etapa2Scripts})}">

<head>
    <title>Análise de Solicitação — Etapa 2</title>
</head>

<body>
<div id="etapa2Conteudo" class="py-5">

    <div class="container">

        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Barra de etapas -->
        <div class="d-flex mb-4">
            <div class="flex-fill text-center py-2 px-3 border fw-semibold"
                 style="background:#EAF3DE;color:#3B6D11;border-color:#639922!important;border-radius:8px 0 0 8px;font-size:14px">
                <i class="bi bi-check-lg me-1"></i> 1 · Revisão
            </div>
            <div class="flex-fill text-center py-2 px-3 fw-semibold border"
                 style="background:#E6F1FB;color:#185FA5;border-color:#378ADD!important;border-left:0;font-size:14px">
                <i class="bi bi-eyedropper me-1"></i> 2 · Separação
            </div>
            <div class="flex-fill text-center py-2 px-3 border text-secondary"
                 style="background:#f8f9fa;border-left:0;border-radius:0 8px 8px 0;font-size:14px">
                <i class="bi bi-clipboard-check me-1"></i> 3 · Resumo
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex align-items-center gap-2 py-3">
                <i class="bi bi-eyedropper fs-5"></i>
                <div>
                    <span class="fw-semibold">Separação de dentes</span>
                    <span class="ms-2 text-secondary" style="font-size:13px">
                        Solicitação #<span th:text="${solicitacao.codigo}"></span>
                    </span>
                </div>
                <span class="badge bg-primary ms-auto">Em análise</span>
            </div>

            <div class="card-body p-4">

                <!-- Apenas nome do aluno -->
                <h6 class="text-uppercase text-secondary fw-semibold mb-1" style="font-size:12px;letter-spacing:.05em">
                    Aluno
                </h6>
                <p class="fs-5 fw-semibold mb-4" th:text="${solicitacao.estudante.nome}">Nome do Aluno</p>

                <hr/>

                <!-- Resumo do que foi pedido -->
                <h6 class="text-uppercase text-secondary fw-semibold mb-3" style="font-size:12px;letter-spacing:.05em">
                    O que foi solicitado
                </h6>
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Tipo de dente</div>
                            <div class="fw-semibold" th:text="${solicitacao.tipoDente}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Dentição</div>
                            <div class="fw-semibold" th:text="${solicitacao.denticao}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Maxilar</div>
                            <div class="fw-semibold" th:text="${solicitacao.maxilar}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#E6F1FB">
                            <div class="text-secondary mb-1" style="font-size:12px">Qtd. solicitada</div>
                            <div class="fw-semibold fs-5" style="color:#185FA5"
                                 th:text="${solicitacao.quantidade} + ' unid.'">— unid.</div>
                        </div>
                    </div>
                </div>

                <hr/>

                <!-- Formulário de separação -->
                <form th:action="@{/analiseSolicitacao/etapa2/salvar}" method="post" id="formSeparacao">
                    <input type="hidden" name="codSolicitacao" th:value="${solicitacao.codigo}"/>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="text-uppercase text-secondary fw-semibold mb-0" style="font-size:12px;letter-spacing:.05em">
                            Frascos selecionados
                        </h6>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnAdicionarFrasco">
                            <i class="bi bi-plus-lg me-1"></i> Adicionar frasco
                        </button>
                    </div>

                    <!-- Lista de linhas de frasco -->
                    <div id="listaFrascos">
                        <!-- Linha template (1ª linha sempre visível) -->
                        <div class="frasco-linha row g-2 align-items-end mb-3 p-3 rounded border">
                            <div class="col-md-7">
                                <label class="form-label text-secondary" style="font-size:12px">Frasco</label>
                                <select name="codFrasco" class="form-select frasco-select" required>
                                    <option value="">-- Selecione um frasco --</option>
                                    <option th:each="frasco : ${frascos}"
                                            th:value="${frasco.codigo}"
                                            th:text="${'Frasco #' + frasco.identificacao + ' · ' + frasco.tipoDente + ' · ' + frasco.denticao + ' · ' + frasco.maxilar + ' · ' + frasco.quantidade + ' unid.'}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-secondary" style="font-size:12px">Qtd. a retirar</label>
                                <input type="number" name="quantidadesRetiradas"
                                       class="form-control qtd-input" min="1" value="1" required/>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-danger btn-sm w-100 btn-remover">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Total separado -->
                    <div class="d-flex justify-content-between align-items-center p-3 rounded mb-4"
                         style="background:#E6F1FB">
                        <span style="font-size:14px;color:#185FA5;font-weight:500">Total separado</span>
                        <span style="font-size:18px;font-weight:600;color:#185FA5" id="totalSeparado">0 unidades</span>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/analiseSolicitacao/etapa1(codigo=${solicitacao.codigo})}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-right me-1"></i> Ir para resumo
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<th:block id="etapa2Scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/

        // Opções de frascos vindas do servidor para clonar em novas linhas
        const frascos = /*[[${frascos}]]*/ [];
        const frascoOptsHtml = frascos.map(f =>
            `<option value="${f.codigo}">Frasco #${f.identificacao} · ${f.tipoDente} · ${f.denticao} · ${f.maxilar} · ${f.quantidade} unid.</option>`
        ).join('');

        function atualizarTotal() {
            const inputs = document.querySelectorAll('.qtd-input');
            let total = 0;
            inputs.forEach(i => total += parseInt(i.value) || 0);
            document.getElementById('totalSeparado').textContent = total + ' unidades';
        }

        document.getElementById('btnAdicionarFrasco').addEventListener('click', function () {
            const lista = document.getElementById('listaFrascos');
            const linha = document.createElement('div');
            linha.className = 'frasco-linha row g-2 align-items-end mb-3 p-3 rounded border';
            linha.innerHTML = `
                <div class="col-md-7">
                    <label class="form-label text-secondary" style="font-size:12px">Frasco</label>
                    <select name="codFrasco" class="form-select frasco-select" required>
                        <option value="">-- Selecione um frasco --</option>
                        ${frascoOptsHtml}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-secondary" style="font-size:12px">Qtd. a retirar</label>
                    <input type="number" name="quantidadesRetiradas" class="form-control qtd-input" min="1" value="1" required/>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-outline-danger btn-sm w-100 btn-remover">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
            lista.appendChild(linha);
            linha.querySelector('.qtd-input').addEventListener('input', atualizarTotal);
            linha.querySelector('.btn-remover').addEventListener('click', function () {
                linha.remove();
                atualizarTotal();
            });
            atualizarTotal();
        });

        // Delegação de eventos para a linha inicial
        document.getElementById('listaFrascos').addEventListener('input', atualizarTotal);
        document.getElementById('listaFrascos').addEventListener('click', function (e) {
            const btnRemover = e.target.closest('.btn-remover');
            if (btnRemover) {
                const linha = btnRemover.closest('.frasco-linha');
                const todasLinhas = document.querySelectorAll('.frasco-linha');
                if (todasLinhas.length > 1) {
                    linha.remove();
                    atualizarTotal();
                }
            }
        });

        atualizarTotal();

        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(a => new bootstrap.Alert(a).close());
        }, 5000);

        /*]]>*/
    </script>
</th:block>

</body>
</html>
