<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          ~{::title},
          ~{::#etapa1Conteudo},
          ~{},
          ~{::#etapa1Scripts})}">

<head>
    <title>Análise de Solicitação — Etapa 1</title>
</head>

<body>
<div id="etapa1Conteudo" class="py-5">

    <div class="container">

        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Barra de etapas -->
        <div class="d-flex mb-4">
            <div class="flex-fill text-center py-2 px-3 fw-semibold border"
                 style="background:#E6F1FB;color:#185FA5;border-color:#378ADD!important;border-radius:8px 0 0 8px;font-size:14px">
                <i class="bi bi-eye me-1"></i> 1 · Revisão
            </div>
            <div class="flex-fill text-center py-2 px-3 border text-secondary"
                 style="background:#f8f9fa;border-left:0;font-size:14px">
                <i class="bi bi-eyedropper me-1"></i> 2 · Separação
            </div>
            <div class="flex-fill text-center py-2 px-3 border text-secondary"
                 style="background:#f8f9fa;border-left:0;border-radius:0 8px 8px 0;font-size:14px">
                <i class="bi bi-clipboard-check me-1"></i> 3 · Resumo
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex align-items-center gap-2 py-3">
                <i class="bi bi-file-earmark-text fs-5"></i>
                <div>
                    <span class="fw-semibold">Revisão do pedido</span>
                    <span class="ms-2 text-secondary" style="font-size:13px">
                        Solicitação #<span th:text="${solicitacao.codigo}"></span>
                    </span>
                </div>
                <span class="badge bg-warning text-dark ms-auto">Pendente</span>
            </div>

            <div class="card-body p-4">

                <!-- Apenas nome do aluno -->
                <h6 class="text-uppercase text-secondary fw-semibold mb-3" style="font-size:12px;letter-spacing:.05em">
                    Aluno
                </h6>
                <p class="fs-5 fw-semibold mb-4" th:text="${solicitacao.estudante.nome}">Nome do Aluno</p>

                <hr/>

                <!-- Dados da solicitação -->
                <h6 class="text-uppercase text-secondary fw-semibold mb-3" style="font-size:12px;letter-spacing:.05em">
                    Dentes solicitados
                </h6>
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Tipo de dente</div>
                            <div class="fw-semibold" th:text="${solicitacao.tipoDente}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Dentição</div>
                            <div class="fw-semibold" th:text="${solicitacao.denticao}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#f8f9fa">
                            <div class="text-secondary mb-1" style="font-size:12px">Maxilar</div>
                            <div class="fw-semibold" th:text="${solicitacao.maxilar}">—</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="p-3 rounded" style="background:#E6F1FB">
                            <div class="text-secondary mb-1" style="font-size:12px">Quantidade</div>
                            <div class="fw-semibold fs-5" style="color:#185FA5"
                                 th:text="${solicitacao.quantidade} + ' unid.'">— unid.</div>
                        </div>
                    </div>
                </div>

                <div class="p-3 rounded mb-4" style="background:#f8f9fa">
                    <div class="text-secondary mb-1" style="font-size:12px">Justificativa do aluno</div>
                    <div th:text="${solicitacao.justificativa}" style="line-height:1.6">—</div>
                </div>

                <hr/>

                <!-- Observação do analista -->
                <h6 class="text-uppercase text-secondary fw-semibold mb-3" style="font-size:12px;letter-spacing:.05em">
                    Observação do analista <span class="text-muted fw-normal">(opcional)</span>
                </h6>

                <!-- Formulário: Prosseguir -->
                <form th:action="@{/analiseSolicitacao/etapa1/prosseguir}" method="post">
                    <input type="hidden" name="codSolicitacao" th:value="${solicitacao.codigo}"/>
                    <textarea name="observacao" rows="3" class="form-control mb-4"
                              placeholder="Registre observações relevantes sobre este pedido..."></textarea>

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                        <!-- Formulário: Negar (aninhado na div, form separado) -->
                        <div class="d-flex align-items-center gap-2">
                            <form th:action="@{/analiseSolicitacao/etapa1/negar}" method="post" class="d-flex gap-2 align-items-center">
                                <input type="hidden" name="codSolicitacao" th:value="${solicitacao.codigo}"/>
                                <input type="text" name="justificativa" class="form-control form-control-sm"
                                       placeholder="Motivo da negação..." style="width:260px" required/>
                                <button type="submit" class="btn btn-sm btn-danger">
                                    <i class="bi bi-x-lg me-1"></i> Negar
                                </button>
                            </form>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-right me-1"></i> Prosseguir para separação
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<th:block id="etapa1Scripts">
    <script th:inline="none">
        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(a => new bootstrap.Alert(a).close());
        }, 5000);
    </script>
</th:block>

</body>
</html>
