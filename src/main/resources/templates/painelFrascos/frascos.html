<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          ~{::title},
          ~{::#painelConteudo},
          ~{::#painelScripts},
          ~{}
      )}">

<head>
  <title>Painel de Frascos</title>
</head>

<body>
<div id="painelConteudo" class="py-5">

  <div class="row justify-content-center mb-3">
    <div class="col-md-10 col-lg-8">
      <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <div class="card card-body mb-4 shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h2">Painel de Frascos</h1>
      <a th:href="@{/frasco}" class="btn btn-outline-success">
        Novo Frasco <i class="bi bi-plus-square"></i>
      </a>
    </div>
    <form id="filtroForm" th:action="@{/frasco/painel}" method="get" class="row g-3 align-items-end">
      <div class="col-md-3">
        <label for="nomeDente" class="form-label fw-bold">Grupo do Dente</label>
        <select id="nomeDente" name="nomeDente" class="form-select">
          <option value="">Todos</option>
          <option th:each="nome : ${T(bancoDentes.model.enumModels.NomeDente).values()}"
                  th:value="${nome.name()}" th:text="${nome}"
                  th:selected="${nome == filtroNomeDente}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="estadoDente" class="form-label fw-bold">Estado</label>
        <select id="estadoDente" name="estadoDente" class="form-select">
          <option value="">Todos</option>
          <option th:each="e : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                  th:value="${e.name()}" th:text="${e}"
                  th:selected="${e == filtroEstadoDente}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="maxilar" class="form-label fw-bold">Posição</label>
        <select id="maxilar" name="maxilar" class="form-select">
          <option value="">Todos</option>
          <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                  th:value="${m.name()}" th:text="${m}"
                  th:selected="${m == filtroMaxilar}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="pesquisa" class="form-label fw-bold">Pesquisar</label>
        <input type="text" id="pesquisa" name="pesquisa" class="form-control" placeholder="Digite algo...">
      </div>
      <div class="col-12 d-flex justify-content-end mt-2">
        <button type="submit" class="btn btn-outline-secondary me-2" title="Buscar">
          <i class="bi bi-search"></i>
        </button>
        <a th:href="@{/frasco/painel}" class="btn btn-outline-secondary" title="Limpar Filtros">
          <i class="bi bi-arrow-repeat"></i>
        </a>
      </div>
    </form>
  </div>

  <div class="card card-body mb-4 shadow-sm">
    <div class="d-flex justify-content-end mb-4">
      <div class="me-2">
        <button id="btnSort"
                type="button"
                class="btn"
                data-bs-toggle="tooltip"
                title="Ordenar por Mais Recentes"
                th:disabled="${#lists.isEmpty(frascos)}">
          <i class="bi bi-sort-down"></i>
        </button>
      </div>

      <div class="btn-group" role="group">
        <button type="button" id="btn-lista" class="btn btn-outline-secondary">
          <i class="bi bi-list-ul"></i>
        </button>
        <button type="button" id="btn-blocos" class="btn btn-secondary active">
          <i class="bi bi-grid-fill"></i>
        </button>
      </div>
    </div>
    <div id="conteudo-dinamico">
      <div th:replace="~{painelFrascos/blocos-frascos :: blocos(${frascos})}"></div>
    </div>

    <div id="paginacao-container" class="mt-4"></div>

  </div>
</div>

<div id="painelScripts">
  <script th:src="@{/js/painelFrascos.js}"></script>
</div>
</body>
</html>

<script>
  document.addEventListener("DOMContentLoaded", function() {
      var alerts = document.querySelectorAll('.alert');

      alerts.forEach(function(alert) {
          setTimeout(function() {

              var bsAlert = new bootstrap.Alert(alert);
              bsAlert.close();

          }, 5000); // <--- Ajuste o tempo aqui (3000 = 3s, 5000 = 5s)
      });
  });
</script>
