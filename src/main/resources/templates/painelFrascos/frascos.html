<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          ~{::title},
          ~{::#painelConteudo},
          ~{::#painelScripts},
          ~{}
      )}">

<head>
  <title>Painel de Frascos</title>
</head>

<body>
<div id="painelConteudo" class="py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center">
      <h1 class="h2 me-3">Painel de Frascos</h1>
    </div>
    <a th:href="@{/frasco}" class="btn btn-primary">
      <i class="bi bi-plus-square"></i> Novo Frasco
    </a>
  </div>

  <div class="card card-body mb-4 shadow-sm">
    <form id="filtroForm" th:action="@{/frasco/painel}" method="get" class="row g-3 align-items-end">
      <div class="col-md-4">
        <label for="nomeDente" class="form-label fw-bold">Tipo de Dente</label>
        <select id="nomeDente" name="nomeDente" class="form-select">
          <option value="">Todos</option>
          <option th:each="nome : ${T(bancoDentes.model.enumModels.NomeDente).values()}"
                  th:value="${nome.name()}" th:text="${nome}"
                  th:selected="${nome == filtroNomeDente}"></option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="estadoDente" class="form-label fw-bold">Estado</label>
        <select id="estadoDente" name="estadoDente" class="form-select">
          <option value="">Todos</option>
          <option th:each="e : ${T(bancoDentes.model.enumModels.EstadoDente).values()}"
                  th:value="${e.name()}"
                  th:text="${e}"
                  th:selected="${e == filtroEstadoDente}"></option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="maxilar" class="form-label fw-bold">Maxilar</label>
        <select id="maxilar" name="maxilar" class="form-select">
          <option value="">Todos</option>
          <option th:each="m : ${T(bancoDentes.model.enumModels.Maxilar).values()}"
                  th:value="${m.name()}" th:text="${m}"
                  th:selected="${m == filtroMaxilar}"></option>
        </select>
      </div>

      <div class="col-12 text-end">
        <button type="submit" title="Filtrar" class="btn btn-primary">
          <i class="bi bi-funnel-fill"></i>
        </button>

        <button id="btnSort"
                type="button"
                class="btn btn-warning"
                data-bs-toggle="tooltip"
                title="Ordenar por Mais Recentes"
                th:disabled="${#lists.isEmpty(frascos)}">
          <i class="bi bi-sort-down"></i>
        </button>

        <a th:href="@{/frasco/painel}" class="btn btn-outline-secondary" title="Limpar Filtros">
          <i class="bi bi-arrow-repeat"></i>
        </a>
      </div>
    </form>
  </div>

  <div class="d-flex justify-content-end mb-4">
    <div class="btn-group" role="group">
      <button type="button" id="btn-blocos" class="btn btn-primary active">
        <i class="bi bi-grid-fill"></i>
      </button>
      <button type="button" id="btn-lista" class="btn btn-outline-primary">
        <i class="bi bi-list-ul"></i>
      </button>
    </div>
  </div>

  <div id="conteudo-dinamico">
    <div th:replace="~{painelFrascos/blocos-frascos :: blocos(${frascos})}"></div>
  </div>

</div>

<div id="painelScripts">
  <script th:src="@{/js/painelFrascos.js}"></script>
</div>

</body>
</html>
