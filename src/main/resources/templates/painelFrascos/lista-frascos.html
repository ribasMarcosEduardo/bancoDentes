<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="lista(frascos)">
  <div th:if="${!#lists.isEmpty(frascos)}" class="table-responsive">

    <table id="tabela-frascos" class="table table-striped table-hover" style="width:100%">
      <thead>
      <tr>
        <th class="text-center">ID</th>
        <th class="text-center">Grupo</th>
        <th class="text-center">Posição</th>
        <th class="text-center">Estado</th>
        <th class="text-center">Qtd.</th>
        <th class="text-center">Data Cadastro</th>
        <th class="text-center">Data de Manutenção</th>
        <th class="text-center" data-orderable="false">Ações</th> </tr>
      </thead>
      <tbody>
      <tr class="text-center" th:each="frasco : ${frascos}">
        <td th:text="${frasco.codFrasco}"></td>
        <td th:text="${frasco.nomDente}"></td>
        <td th:text="${frasco.maxilar ?: '-'}"></td>
        <td th:text="${frasco.estado}"></td>
        <td th:text="${frasco.quantidade}"></td>
        <td th:text="${#temporals.format(frasco.datCad, 'dd/MM/yy HH:mm')}"></td>
        <td th:text="${#temporals.format(frasco.datManutencao, 'dd/MM/yy HH:mm')}"></td>
        <td>
          <a th:href="@{/frasco/editar/{id}(id=${frasco.codFrasco})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${#lists.isEmpty(frascos)}" class="alert alert-info mt-4" role="alert">
    Nenhum frasco corresponde aos filtros selecionados.
  </div>
</div>

</body>
</html>
