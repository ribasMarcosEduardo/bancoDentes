<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="blocos(frascos)">

    <div th:if="${!#lists.isEmpty(frascos)}" id="cardsContainer" class="row g-4">
        <div th:each="frasco : ${frascos}"
             class="col-md-6 col-lg-4 frasco-card"
             th:data-id="${frasco.codFrasco}"
             th:data-dat-cad="${#temporals.format(frasco.datCad, 'yyyy-MM-dd')}">

            <div class="card h-100 shadow-sm">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0" th:text="${frasco.nomDente}">Nome do Dente</h5>
                    <h5 class="card-title mb-0" th:text="${frasco.identificacao}">Nome do Dente</h5>
                    <span class="badge bg-secondary rounded-pill" th:text="'ID: ' + ${frasco.codFrasco}">ID</span>
                </div>

                <div class="card-body">
                    <ul class="list-group list-group-flush">
                        <li th:if="${frasco.maxilar != null}" class="list-group-item"><strong>Maxilar:</strong> <span
                                th:text="${frasco.maxilar}"></span></li>
                        <li th:if="${frasco.posicao != null}" class="list-group-item"><strong>Posição:</strong> <span
                                th:text="${frasco.posicao}"></span></li>
                        <li class="list-group-item"><strong>Estado:</strong> <span th:text="${frasco.estado}"></span></li>
                        <li class="list-group-item"><strong>Quantidade:</strong> <span
                                th:text="${frasco.quantidade}"></span></li>
                        <li class="list-group-item text-muted">
                            <small>Cadastrado em: <span
                                    th:text="${#temporals.format(frasco.datCad, 'dd/MM/yyyy HH:mm')}"></span></small>
                            <br>
                            <small>Manutenção em: <span
                                    th:text="${#temporals.format(frasco.datManutencao, 'dd/MM/yyyy HH:mm')}"></span></small>
                        </li>

                    </ul>
                </div>

                <div class="card-footer d-flex justify-content-end gap-2">
                    <a th:href="@{/frasco/editar/{id}(id=${frasco.codFrasco})}"
                       class="btn btn-sm btn-outline-primary"
                       title="Editar Frasco">
                        <i class="bi bi-pencil"></i>
                    </a>

                    <form method="post"
                          th:action="@{/frasco/excluirFrasco/{id}(id=${frasco.codFrasco})}"
                          onsubmit="return confirm('Tem certeza que deseja excluir este frasco?');">

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger"
                                title="Excluir">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(frascos)}" class="alert alert-info mt-4" role="alert">
        <h4 class="alert-heading">Nenhum frasco encontrado!</h4>
        <p>Ainda não há frascos cadastrados no sistema ou nenhum item corresponde ao filtro selecionado.</p>
    </div>
</div>

</body>
</html>
