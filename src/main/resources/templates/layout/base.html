<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, conteudo, cssExtra, jsExtra)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title th:replace="${titulo}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" />

    <th:block th:replace="${cssExtra} ?: ~{}"></th:block>

    <style>
        .custom-header { background-color: #212529; }
        .custom-header .btn { color: white; border: none; }
    </style>

</head>

<body>
<header>
    <div th:replace="~{layout/navBar :: menu}"></div>
</header>

<main class="container mt-4">
    <div th:replace="${conteudo}"></div>
</main>

<footer class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center">
        <span class="text-muted">© 2026 Banco de Dentes - Laboratório de Odontologia - Orientador: Kleyton H.</span>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="//cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json"></script>

<th:block th:replace="${jsExtra} ?: ~{}"></th:block>

</body>
</html>
