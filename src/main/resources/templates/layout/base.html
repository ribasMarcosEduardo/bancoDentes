<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, conteudo, cssExtra, jsExtra)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title th:replace="${titulo}"></title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS adicional da página -->
    <th:block th:replace="${cssExtra} ?: ~{}"></th:block>
</head>

<body>
<header>
    <!-- cabeçalho global opcional -->
</header>

<main class="container mt-4">
    <div th:replace="${conteudo}"></div>
</main>

<footer>
    <!-- rodapé global opcional -->
</footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

<!-- JS adicional da página -->
<th:block th:replace="${jsExtra} ?: ~{}"></th:block>

</body>
</html>
