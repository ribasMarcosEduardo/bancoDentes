<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function () {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = localStorage.getItem("theme") || (prefersDark ? "dark" : "light");
        document.documentElement.classList.add(theme, "carregando");
    })();
  </script>

  <script>
    // Chegou por View Transition (navegação dentro do fluxo): a troca já é
    // animada, então a entrada em sequência da página é pulada (ver
    // css/pages/etiquetas.css). Precisa rodar no <head>, antes do 1º paint.
    // Vindo de fora do fluxo (ex.: painéis, que também têm @view-transition),
    // cancela o fade e a página entra animada.
    window.addEventListener("pagereveal", function (e) {
        if (!e.viewTransition) return;

        var origem = document.referrer ? new URL(document.referrer).pathname : "";
        if (origem.indexOf("/etiqueta/") === 0) {
            document.documentElement.classList.add("vt-nav");
        } else {
            e.viewTransition.skipTransition();
        }
    });
  </script>

  <link rel="stylesheet" th:href="@{/css/vendor/sweetalert2.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/pages/etiquetas.css}">
  <link rel="stylesheet" th:href="@{/css/pages/fila_etiquetas.css}">

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <title>Imprimir Etiquetas</title>
</head>

<body>

<div class="background">
  <div class="blob blob--blue"></div>
  <div class="blob blob--green"></div>
</div>

<div th:replace="~{partials/navbar :: navbar}"></div>

<main class="page">
  <section class="form-shell">

    <div class="stepper etiquetas-stepper">
      <h1 class="etiquetas-stepper__titulo">Imprimir etiquetas</h1>

      <div class="step step--active" data-step="selecao">
        <div class="step__circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks icon" aria-hidden="true"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>
        </div>
        <span>Selecionar frascos</span>
      </div>

      <div class="stepper__line"></div>

      <div class="step" data-step="configurar">
        <div class="step__circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-grid icon" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </div>
        <span>Configurar folha</span>
      </div>

      <div class="stepper__line"></div>

      <div class="step" data-step="gerar">
        <div class="step__circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-printer icon" aria-hidden="true"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
        </div>
        <span>Gerar</span>
      </div>

      <div class="etapa-compacta etapa-compacta--etapa-1">
        <div class="etapa-compacta__anel">
          <svg viewBox="0 0 56 56" aria-hidden="true">
            <circle class="etapa-compacta__trilho" cx="28" cy="28" r="24" pathLength="100"></circle>
            <circle class="etapa-compacta__progresso" cx="28" cy="28" r="24" pathLength="100"></circle>
          </svg>
          <span class="etapa-compacta__contagem">1 de 3</span>
        </div>

        <div class="etapa-compacta__texto">
          <span class="etapa-compacta__titulo">Selecionar frascos</span>
          <span class="etapa-compacta__proxima">Próxima: Configurar folha</span>
        </div>
      </div>

      <script>
        // Enchimento do anel do stepper compacto: parte do progresso da etapa
        // de onde se veio e vai até o desta (--progresso, css/pages/etiquetas.css)
        // - cresce ao avançar, esvazia ao voltar. Inline logo após o anel pra
        // valer já no 1º paint (fill backwards). Dentro do fluxo (com View
        // Transition) espera o card do stepper terminar de se transformar.
        // Mesmo script em configurarEtiquetas.html.
        (function () {
          var anel = document.querySelector(".etapa-compacta__progresso");
          if (!anel || !anel.animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

          var progressoPorEtapa = { "/etiqueta/fila": 33.33, "/etiqueta/configurar": 66.67, "/etiqueta/imprimir": 100 };
          var origem = document.referrer ? new URL(document.referrer).pathname : "";
          var ate = parseFloat(getComputedStyle(anel).getPropertyValue("--progresso"));
          var de = origem in progressoPorEtapa ? progressoPorEtapa[origem] : ate - 33.33;

          if (isNaN(ate) || Math.abs(de - ate) < 1) return;

          var comTransicao = origem.indexOf("/etiqueta/") === 0 && origem !== "/etiqueta/imprimir";

          anel.animate(
            [{ strokeDashoffset: String(100 - de) }, { strokeDashoffset: String(100 - ate) }],
            { duration: 600, delay: comTransicao ? 350 : 150, easing: "cubic-bezier(0.65, 0, 0.35, 1)", fill: "backwards" }
          );
        })();
      </script>
    </div>

    <th:block th:if="${#lists.isEmpty(frascos)}">
      <div th:replace="~{partials/empty_state :: empty_state('printer', 'Fila de impressão vazia', 'Nenhum frasco está aguardando etiqueta. Frascos novos ou com manutenção concluída entram aqui automaticamente; também dá para enviar um frasco pelo ícone de impressora no painel de frascos.', false)}">
      </div>
    </th:block>

    <form th:if="${!#lists.isEmpty(frascos)}" id="formFilaEtiquetas" th:action="@{/etiqueta/configurar}" method="post">
      <div class="pagination__nav etiqueta-fila-paginacao" id="filaPaginacao" hidden>
        <span class="pagination__range" id="filaPaginacaoRange">1-20</span>

        <button type="button" class="btn btn-pagination" id="filaPaginaAnterior" data-tooltip="Página anterior" aria-label="Página anterior">
          <i class="icon" data-lucide="chevron-left"></i>
        </button>

        <button type="button" class="btn btn-pagination" id="filaPaginaProxima" data-tooltip="Próxima página" aria-label="Próxima página">
          <i class="icon" data-lucide="chevron-right"></i>
        </button>
      </div>

      <div class="result-table result-table--etiqueta-selecao">
        <div class="result-table__head">
          <span>
            <input type="checkbox" class="etiqueta-selecao-checkbox" id="selecionarTodosEtiqueta" checked aria-label="Selecionar todos os frascos da fila">
          </span>
          <span>Identificador</span>
          <span>Grupo</span>
          <span>Local</span>
          <span>Qtd.</span>
          <span>Próxima manutenção</span>
          <span></span>
        </div>

        <div id="listaFrascosEtiqueta">
          <label th:each="frasco : ${frascos}" class="result-list etiqueta-fila-row">
            <span>
              <input type="checkbox" class="etiqueta-selecao-checkbox" name="frascos"
                     th:value="${frasco.codigo}" checked
                     th:aria-label="'Imprimir etiqueta de ' + ${frasco.identificacao}">
            </span>
            <span class="result-list__code" th:text="${frasco.identificacao != null ? frasco.identificacao : 'FR-' + frasco.codigo}">PMbd-A001</span>
            <span th:text="${frasco.tipoDente}">Pré-Molar</span>
            <span th:text="${frasco.local != null ? (frasco.local == T(bancoDentes.model.enumModels.Local).BDH ? 'BDH' : frasco.local.nome) : '---'}">BDH</span>
            <span th:text="${frasco.quantidade}">0</span>
            <span th:if="${frasco.prazoManutencao != null}" class="manutencao"
                  th:classappend="'manutencao--' + ${frasco.prazoManutencao.css}"
                  th:title="${frasco.prazoManutencao.descricao}"><i class="icon" th:attr="data-lucide=${frasco.prazoManutencao.icone}" aria-hidden="true"></i><th:block th:text="${#temporals.format(frasco.datManutencao, 'dd/MM/yy')}">21/06/26</th:block></span>
            <span th:unless="${frasco.prazoManutencao != null}">---</span>
            <div class="result-list__actions">
              <button type="submit" class="result-list__action result-list__action--red js-remover-fila"
                      th:formaction="@{/etiqueta/removerFila/{id}(id=${frasco.codigo})}"
                      th:data-identificacao="${frasco.identificacao}"
                      data-tooltip="Remover da fila" aria-label="Remover da fila">
                <i class="icon" data-lucide="x"></i>
              </button>
            </div>
          </label>
        </div>
      </div>
    </form>

  </section>
</main>

<div class="etiqueta-acoes-bar etiqueta-acoes-bar--tres-acoes" id="etiquetaSelecaoBar">
  <span class="etiqueta-acoes-bar__count" id="etiquetaSelecaoCount"
        th:text="${#lists.isEmpty(frascos)} ? 'Nenhum frasco na fila' : ${#lists.size(frascos)} + ' de ' + ${#lists.size(frascos)} + ' frascos selecionados'">Nenhum frasco na fila</span>

  <div class="etiqueta-acoes-bar__actions">
    <a th:href="@{/frasco/painel}" class="btn btn-ghost">
      <i class="orderBy-icon" data-lucide="arrow-left"></i>
      <span class="btn__label">Voltar</span>
    </a>

    <button type="submit" form="formFilaEtiquetas" class="btn btn-tonal" id="btnConfirmarImpressaoFila"
            th:formaction="@{/etiqueta/confirmar}"
            th:disabled="${#lists.isEmpty(frascos)}">
      <i class="orderBy-icon" data-lucide="check"></i>
      <span class="btn__label">Confirmar<span class="btn__label-extra"> impressão</span></span>
    </button>

    <button type="submit" form="formFilaEtiquetas" class="btn btn-primary" id="btnContinuarEtiqueta"
            th:disabled="${#lists.isEmpty(frascos)}">
      <span class="btn__label">Continuar</span>
      <i class="orderBy-icon" data-lucide="arrow-right"></i>
    </button>
  </div>
</div>

<div th:replace="~{partials/footer :: footer}"></div>

<script th:src="@{/js/bundles/form.js}"></script>
<script th:src="@{/js/etiquetas-fila.js}"></script>

</body>
</html>
