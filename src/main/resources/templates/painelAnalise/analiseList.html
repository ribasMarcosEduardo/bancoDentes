<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::#painelAnalistaConteudo}, ~{}, ~{::#meusScripts})}">
<head>
    <title>Painel de Avaliação</title>
</head>
<body class="py-5">

<div id="painelAnalistaConteudo" class="container">

    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensagemSucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensagemErro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-shield-check fs-4"></i>
                <h1 class="h5 mb-0">Painel de Avaliação de Solicitações</h1>
            </div>
            <span class="badge bg-secondary">Modo Analista</span>
        </div>

        <div class="card-body p-4">

            <div th:if="${!#lists.isEmpty(solicitacoes)}" class="table-responsive">
                <table id="tabela-analise" class="table table-striped table-hover align-middle" style="width:100%">
                    <thead>
                    <tr>
                        <th class="text-center">Aluno</th> <th class="text-center">Tipo</th>
                        <th class="text-center">Data</th>
                        <th class="text-center">Dentição</th>
                        <th class="text-center">Maxilar</th>
                        <th class="text-center">Qtd.</th>
                        <th class="text-center">Just.</th>
                        <th class="text-center" data-orderable="false">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="text-center" th:each="solicitacao : ${solicitacoes}">  </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(solicitacoes)}" class="alert alert-info shadow-sm mb-0" role="alert">
                <i class="bi bi-info-circle me-2"></i> Não há nenhuma solicitação pendente de análise no momento.
            </div>

        </div>
    </div>
</div>

<th:block id="meusScripts">
    <script th:inline="none">
        $(document).ready(function() {
          // Inicializa o DataTable
          $('#tabela-analise').DataTable({
            language: { url: '//cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json' },
            order: [[1, 'desc']], // Ordena por data mais recente
            columnDefs: [
              { orderable: false, targets: [-1, -2] } // Desativa ordenação em Ações e Justificativa
            ],
            searching: true // Mantido true para o analista conseguir buscar por ID ou Tipo facilmente
          });

          // Inicializa os Popovers do Bootstrap
          var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
          var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl)
          });
        });
    </script>
</th:block>

</body>
</html>
