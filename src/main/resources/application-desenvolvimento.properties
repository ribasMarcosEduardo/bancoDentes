spring.main.banner-mode=off
spring.application.name=bancoDentes

server.servlet.session.timeout=15m

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:banco-de-dentes-db}:3306/BANCO_DENTES?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
